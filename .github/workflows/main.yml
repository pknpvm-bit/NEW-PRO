name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Locate project & enable BreakContinueInInlineLambdas
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          matches = list(Path(".").rglob("app/build.gradle.kts"))
          if not matches:
              raise FileNotFoundError("Could not find app/build.gradle.kts anywhere in the repository.")

          gradle_file = matches[0]
          project_root = gradle_file.parent.parent.resolve()

          snippet = '''
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
              compilerOptions.freeCompilerArgs.add("-XXLanguage:+BreakContinueInInlineLambdas")
          }
          '''.strip() + "\n"

          content = gradle_file.read_text(encoding="utf-8")
          if "BreakContinueInInlineLambdas" not in content:
              gradle_file.write_text(content + "\n" + snippet, encoding="utf-8")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_root}\n")
              f.write(f"APK_OUTPUT_DIR={gradle_file.parent / 'build' / 'outputs' / 'apk' / 'debug'}\n")
          PY

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APK_OUTPUT_DIR }}/*.apk
          if-no-files-found: error
