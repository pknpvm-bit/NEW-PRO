name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Prepare Gradle files & enable BreakContinueInInlineLambdas
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          app_matches = list(Path(".").rglob("app/build.gradle.kts"))
          if not app_matches:
              raise FileNotFoundError("Could not find app/build.gradle.kts anywhere in the repository.")

          app_gradle = app_matches[0].resolve()
          project_root = app_gradle.parent.parent

          settings_kts = project_root / "settings.gradle.kts"
          settings_groovy = project_root / "settings.gradle"
          if not settings_kts.exists() and not settings_groovy.exists():
              settings_kts.write_text(
                  'pluginManagement {\n'
                  '    repositories {\n'
                  '        google()\n'
                  '        mavenCentral()\n'
                  '        gradlePluginPortal()\n'
                  '    }\n'
                  '}\n'
                  'dependencyResolutionManagement {\n'
                  '    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n'
                  '    repositories {\n'
                  '        google()\n'
                  '        mavenCentral()\n'
                  '    }\n'
                  '}\n'
                  f'rootProject.name = "{project_root.name}"\n'
                  'include(":app")\n',
                  encoding="utf-8",
              )

          root_build_kts = project_root / "build.gradle.kts"
          root_build_groovy = project_root / "build.gradle"
          if not root_build_kts.exists() and not root_build_groovy.exists():
              root_build_kts.write_text(
                  'plugins {\n'
                  '    id("com.android.application") version "8.5.2" apply false\n'
                  '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n'
                  '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false\n'
                  '}\n',
                  encoding="utf-8",
              )

          gradle_props = project_root / "gradle.properties"
          required_props = {
              "org.gradle.jvmargs": "-Xmx2048m -Dfile.encoding=UTF-8",
              "android.useAndroidX": "true",
              "kotlin.code.style": "official",
              "android.nonTransitiveRClass": "true",
          }
          existing_props = gradle_props.read_text(encoding="utf-8") if gradle_props.exists() else ""
          lines = [existing_props.rstrip()] if existing_props.strip() else []
          for key, val in required_props.items():
              if f"{key}=" not in existing_props:
                  lines.append(f"{key}={val}")
          gradle_props.write_text("\n".join(lines) + "\n", encoding="utf-8")

          snippet = '''
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
              compilerOptions.freeCompilerArgs.add("-XXLanguage:+BreakContinueInInlineLambdas")
          }
          '''.strip() + "\n"

          content = app_gradle.read_text(encoding="utf-8")
          if "BreakContinueInInlineLambdas" not in content:
              app_gradle.write_text(content + "\n" + snippet, encoding="utf-8")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_root}\n")
              f.write(f"APK_OUTPUT_DIR={app_gradle.parent / 'build' / 'outputs' / 'apk' / 'debug'}\n")
          PY

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APK_OUTPUT_DIR }}/*.apk
          if-no-files-found: error
