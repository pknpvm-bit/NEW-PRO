name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Locate Gradle root & enable BreakContinueInInlineLambdas
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          settings_matches = list(Path(".").rglob("settings.gradle.kts")) + list(Path(".").rglob("settings.gradle"))
          if not settings_matches:
              raise FileNotFoundError("Could not find settings.gradle.kts or settings.gradle in the repository.")

          project_root = settings_matches[0].parent.resolve()
          app_gradle = project_root / "app" / "build.gradle.kts"
          if not app_gradle.exists():
              app_matches = list(Path(".").rglob("app/build.gradle.kts"))
              if not app_matches:
                  raise FileNotFoundError("Could not find app/build.gradle.kts in the repository.")
              app_gradle = app_matches[0]

          snippet = '''
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
              compilerOptions.freeCompilerArgs.add("-XXLanguage:+BreakContinueInInlineLambdas")
          }
          '''.strip() + "\n"

          content = app_gradle.read_text(encoding="utf-8")
          if "BreakContinueInInlineLambdas" not in content:
              app_gradle.write_text(content + "\n" + snippet, encoding="utf-8")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"PROJECT_DIR={project_root}\n")
              f.write(f"APK_OUTPUT_DIR={app_gradle.parent / 'build' / 'outputs' / 'apk' / 'debug'}\n")
          PY

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APK_OUTPUT_DIR }}/*.apk
          if-no-files-found: error
